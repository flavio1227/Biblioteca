name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Debug build output
        run: |
          echo "📦 Build output structure:"
          ls -la dist/ || echo "dist directory not found"
          echo ""
          if [ -f dist/index.html ]; then
            echo "📄 index.html exists"
            echo "📄 First 1000 chars of index.html:"
            head -c 1000 dist/index.html
            echo ""
          fi
      
      - name: Fix HTML paths
        run: |
          echo "🔧 Running path fix script..."
          node scripts/fix-paths.mjs
          echo ""
          echo "📄 Verifying fixed HTML..."
          if [ -f dist/index.html ]; then
            echo "Script tags found:"
            grep -oP '<script[^>]*src=["'"'"'][^"'"'"']+["'"'"'][^>]*>' dist/index.html || echo "No script tags with src found"
            echo ""
            echo "Link tags found:"
            grep -oP '<link[^>]*href=["'"'"'][^"'"'"']+["'"'"'][^>]*>' dist/index.html || echo "No link tags with href found"
          fi
      
      - name: Copy 404.html
        run: cp public/404.html dist/404.html || echo "404.html not found, skipping"
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

