name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Fix HTML paths
        run: |
          if [ -f dist/index.html ]; then
            cd dist
            echo "📄 Checking original HTML..."
            grep -E '(src|href)=' index.html | head -5 || echo "No src/href found"
            echo ""
            echo "🔧 Fixing paths..."
            # Fix all absolute paths that don't start with /Mapas/
            # Pattern: src="/something" -> src="/Mapas/something"
            sed -i.bak 's|\(src\|href\)="/\([^"]*\)"|\1="/Mapas/\2"|g' index.html
            # Fix any double /Mapas/Mapas/ that might have been created
            sed -i.bak 's|/Mapas/Mapas/|/Mapas/|g' index.html
            # Remove backup file
            rm -f index.html.bak
            echo ""
            echo "✅ Fixed paths in index.html"
            echo "📄 Checking fixed HTML..."
            grep -E '(src|href)=' index.html | head -5 || echo "No src/href found"
          else
            echo "⚠️ dist/index.html not found, skipping path fix"
          fi
      
      - name: Copy 404.html
        run: cp public/404.html dist/404.html || echo "404.html not found, skipping"
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

