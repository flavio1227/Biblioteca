name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Debug build output
        run: |
          echo "📦 Build output structure:"
          ls -la dist/ || echo "dist directory not found"
          echo ""
          if [ -f dist/index.html ]; then
            echo "📄 Full index.html content:"
            cat dist/index.html
            echo ""
            echo "📄 Searching for script tags:"
            grep -E '<script' dist/index.html || echo "No script tags found"
          fi
      
      - name: Fix HTML paths
        run: |
          if [ -f dist/index.html ]; then
            cd dist
            echo "📄 Original HTML (first 100 chars of script tags):"
            grep -oP '<script[^>]*>' index.html | head -3 || echo "No script tags found"
            echo ""
            echo "🔧 Fixing ALL paths..."
            # Fix script src attributes - handle both quoted and unquoted
            sed -i.bak 's|src="/\([^"]*\)"|src="/Mapas/\1"|g' index.html
            sed -i.bak "s|src='/\([^']*\)'|src='/Mapas/\1'|g" index.html
            sed -i.bak 's|src=\(/[^ >]*\)|src=/Mapas\1|g' index.html
            # Fix link href attributes
            sed -i.bak 's|href="/\([^"]*\)"|href="/Mapas/\1"|g' index.html
            sed -i.bak "s|href='/\([^']*\)'|href='/Mapas/\1'|g" index.html
            sed -i.bak 's|href=\(/[^ >]*\)|href=/Mapas\1|g' index.html
            # Fix any double /Mapas/Mapas/ that might have been created
            sed -i.bak 's|/Mapas/Mapas/|/Mapas/|g' index.html
            # Remove backup file
            rm -f index.html.bak
            echo ""
            echo "✅ Fixed paths in index.html"
            echo "📄 Fixed HTML (script tags):"
            grep -oP '<script[^>]*>' index.html | head -3 || echo "No script tags found"
            echo ""
            echo "📄 Full fixed index.html:"
            cat index.html
          else
            echo "⚠️ dist/index.html not found, skipping path fix"
          fi
      
      - name: Copy 404.html
        run: cp public/404.html dist/404.html || echo "404.html not found, skipping"
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

