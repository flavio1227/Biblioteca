name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Fix HTML paths
        run: |
          cd dist
          if [ -f index.html ]; then
            # Replace src="/ with src="/Mapas/ (but not if already /Mapas/)
            sed -i.bak 's|src="/\([^M]|src="/Mapas/\1|g' index.html
            sed -i.bak 's|href="/\([^M]|href="/Mapas/\1|g' index.html
            # Handle cases where path starts directly after /
            sed -i.bak 's|src="/\(src\|assets\|vite\)|src="/Mapas/\1|g' index.html
            sed -i.bak 's|href="/\(src\|assets\|vite\)|href="/Mapas/\1|g' index.html
            rm -f index.html.bak
            echo "Fixed paths in index.html"
            grep -E "(src|href)=[\"']/" index.html | head -3
          fi
      
      - name: Copy 404.html
        run: cp public/404.html dist/404.html || echo "404.html not found, skipping"
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

